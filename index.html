<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SATRIA MBG - Ultra Pro Analyzer</title>
    <style>
        /* TEMA ULTRA PREMIUM SCI-FI */
        :root {
            --bg-deep: #050b14;
            --panel-glass: rgba(10, 25, 47, 0.65);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --text-main: #e2f1f8;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background: radial-gradient(circle at center, #0a192f 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px;
            background: rgba(5, 11, 20, 0.8);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            z-index: 100;
        }
        
        .header-logos { display: flex; gap: 15px; align-items: center; }
        .header-logos img { width: 45px; height: 45px; object-fit: contain; }

        .sys-title { text-align: center; cursor: pointer; }
        .sys-title h1 { font-size: 24px; font-weight: 800; color: var(--neon-blue); letter-spacing: 4px; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .sys-title p { font-size: 10px; color: var(--neon-blue); letter-spacing: 2px; opacity: 0.7;}
        
        #clock { font-family: monospace; font-size: 18px; color: var(--neon-blue); }

        .screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .screen.active { display: flex; animation: bootUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes bootUp { 0% { opacity: 0; transform: scale(0.95) translateY(20px); filter: blur(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }

        /* GLASS PANELS */
        .glass-box {
            background: var(--panel-glass);
            border: 1px solid rgba(0,240,255,0.3);
            border-radius: 15px;
            padding: 40px;
            box-shadow: inset 0 0 20px rgba(0,240,255,0.05), 0 20px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            text-align: center;
            width: 100%; max-width: 550px;
        }

        h2 { font-size: 28px; margin-bottom: 10px; font-weight: 300; letter-spacing: 2px;}
        input {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(0,240,255,0.3);
            color: var(--neon-blue); font-size: 16px; text-align: center;
            border-radius: 8px; outline: none; font-family: monospace;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0,240,255,0.3); }

        button {
            width: 100%; padding: 18px; border-radius: 8px; border: none;
            background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); font-size: 16px; font-weight: 700; letter-spacing: 2px;
            cursor: pointer; text-transform: uppercase; transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,240,255,0.2);
        }
        button:active { transform: scale(0.97); }

        /* =========================================
           ANIMASI 3D LACI & PIPET (PREPARATION) 
           ========================================= */
        .chamber-3d {
            perspective: 1000px; 
            width: 100%; height: 400px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Laci Kaset */
        .tray {
            width: 250px; height: 350px;
            background: #111; border: 2px solid #333; border-radius: 10px;
            transform: rotateX(60deg) translateY(-200px); 
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
        }
        .tray.open { transform: rotateX(60deg) translateY(0px); opacity: 1; }
        
        /* Desain Kaset Disc 3D */
        .disc-3d {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ccc 0deg, #fff 10deg, #ccc 20deg, #fff 30deg, #ccc 40deg, #fff 50deg, #ccc 60deg, #fff 70deg, #ccc 80deg, #fff 90deg, #ccc 100deg, #fff 110deg, #ccc 120deg, #fff 130deg, #ccc 140deg, #fff 150deg, #ccc 160deg, #fff 170deg, #ccc 180deg, #fff 190deg, #ccc 200deg, #fff 210deg, #ccc 220deg, #fff 230deg, #ccc 240deg, #fff 250deg, #ccc 260deg, #fff 270deg, #ccc 280deg, #fff 290deg, #ccc 300deg, #fff 310deg, #ccc 320deg, #fff 330deg, #ccc 340deg, #fff 350deg, #ccc 360deg);
            border: 2px solid #888;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .disc-port {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; background: #222; border-radius: 50%;
            border: 2px solid #555;
            transition: box-shadow 0.5s;
        }

        /* Pipet & Tetesan */
        .pipette-container {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            transition: top 1s ease-in-out;
            z-index: 10;
        }
        .pipette-container.lowered { top: 70px; }
        
        .pipette {
            width: 14px; height: 120px;
            background: linear-gradient(to right, #ccc, #fff, #ccc);
            border-radius: 0 0 10px 10px;
            position: relative; margin: 0 auto;
        }
        .pipette::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 10px; background: #fff; border-radius: 2px;
        }
        
        .drop {
            width: 12px; height: 12px;
            background: var(--neon-blue); border-radius: 50%;
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            opacity: 0; box-shadow: 0 0 15px var(--neon-blue);
            transition: transform 0.5s ease-in, opacity 0.2s;
        }
        .drop.falling { opacity: 1; transform: translate(-50%, 150px) scale(0.5); }

        .status-text { font-family: monospace; color: var(--neon-blue); font-size: 16px; height: 20px; margin-top: 20px;}

        /* =========================================
           ANIMASI SCANNING 1000GB (RADAR)
           ========================================= */
        .scanner-ring {
            width: 350px; height: 350px;
            border-radius: 50%; position: relative;
            border: 2px solid rgba(0, 240, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .scanner-ring::before {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 60%, rgba(0, 240, 255, 0.8) 100%);
            animation: spin 1.5s linear infinite;
        }
        
        .core-data { position: absolute; font-family: monospace; font-size: 24px; font-weight: bold; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .hud-grid {
            position: absolute; width: 80%; height: 80%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.2) 1px, transparent 1px);
            background-size: 20px 20px; border-radius: 50%; opacity: 0.3;
        }
        
        .data-stream {
            font-family: monospace; font-size: 12px; color: rgba(0, 240, 255, 0.6);
            position: absolute; text-align: left;
            width: 250px; height: 100px; overflow: hidden;
        }
        .data-left { left: 5%; top: 30%; }
        .data-right { right: 5%; top: 30%; text-align: right; }

        /* =========================================
           HASIL (RESULT)
           ========================================= */
        .result-box { text-align: center; padding: 40px; border-radius: 15px; width: 100%; max-width: 600px; position: relative; overflow: hidden; }
        .safe { background: rgba(0, 255, 102, 0.1); border: 2px solid var(--neon-green); box-shadow: 0 0 40px rgba(0, 255, 102, 0.2); }
        .danger { background: rgba(255, 0, 60, 0.1); border: 2px solid var(--neon-red); box-shadow: 0 0 40px rgba(255, 0, 60, 0.4); animation: pulseDanger 1s infinite alternate; }
        
        @keyframes pulseDanger { from { box-shadow: 0 0 20px rgba(255,0,60,0.2); } to { box-shadow: 0 0 60px rgba(255,0,60,0.6); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; text-align: left;
            background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; font-family: monospace;
        }

        #secret-dot { color: var(--bg-deep); font-size: 8px; transition: color 0.3s; }
    </style>
</head>
<body>

    <!-- HEADER DENGAN GAMBAR LOGO OTOMATIS -->
    <header>
        <div class="header-logos">
            <!-- NAMA FILE GAMBAR HARUS SAMA PERSIS DENGAN INI -->
            <img src="logo-bgn.png" alt="Logo BGN">
            <img src="logo-undip.png" alt="Logo UNDIP">
        </div>
        <div class="sys-title" onclick="toggleSecret()">
            <h1>SATRIA MBG <span id="secret-dot">●</span></h1>
            <p>ADVANCED PATHOGEN DETECTION SYSTEM V.2</p>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <!-- 1. LOGIN -->
    <main id="screen-login" class="screen active">
        <div class="glass-box">
            <h2>SYSTEM LOGIN</h2>
            <input type="text" value="OPR-SMG-77X">
            <input type="password" value="********">
            <button onclick="showScreen('screen-setup')">INISIALISASI SISTEM</button>
        </div>
    </main>

    <!-- 2. SETUP BATCH -->
    <main id="screen-setup" class="screen">
        <div class="glass-box">
            <h2>DATA BATCH MBG</h2>
            <input type="text" id="batch-id" value="BATCH_ID: MBG-2026-X99" readonly>
            <input type="text" placeholder="Masukkan Komposisi Menu..." value="Nasi, Ayam Goreng, Sayur">
            <button onclick="startPreparation()">SIAPKAN KANTONG ANALISIS</button>
        </div>
    </main>

    <!-- 3. ANIMASI PERSIAPAN (TRAY & PIPET) -->
    <main id="screen-prep" class="screen">
        <h2 style="position: absolute; top: 10%; color: var(--neon-blue); font-weight: 300;">KALIBRASI PERANGKAT KERAS</h2>
        <div class="status-text" id="prep-status" style="position: absolute; top: 18%;">Menunggu perintah mekanisme laci...</div>
        
        <div class="chamber-3d">
            <div class="pipette-container" id="sys-pipette">
                <div class="pipette"></div>
                <div class="drop" id="sys-drop"></div>
            </div>
            
            <div class="tray" id="sys-tray">
                <div class="disc-3d">
                    <div class="disc-port" id="sys-port"></div>
                </div>
            </div>
        </div>

        <button id="btn-action" onclick="stepTrayOpen()" style="position: absolute; bottom: 10%; width: 300px;">BUKA LACI KASET</button>
    </main>

    <!-- 4. ANIMASI SCANNING BERAT (RADAR) -->
    <main id="screen-scan" class="screen">
        <div class="data-stream data-left" id="hex-stream-1"></div>
        <div class="data-stream data-right" id="hex-stream-2"></div>

        <div class="scanner-ring">
            <div class="hud-grid"></div>
            <div class="core-data" id="scan-pct">0%</div>
        </div>
        <div class="status-text" id="scan-log" style="margin-top: 40px; font-size: 20px;">MENYELARASKAN OPTIK LASER...</div>
    </main>

    <!-- 5. HASIL -->
    <main id="screen-result" class="screen">
        <div id="result-box" class="result-box">
            <h1 id="res-title" style="font-size: 40px; font-weight: 800; margin-bottom: 10px;">-</h1>
            <p id="res-desc" style="font-size: 16px; margin-bottom: 20px;">-</p>
            
            <div class="metrics-grid">
                <div>> E. coli O157:H7</div> <div id="res-ecoli" style="text-align: right;">-</div>
                <div>> Salmonella spp.</div> <div id="res-salmo" style="text-align: right;">-</div>
                <div>> Staphylococcus aureus</div> <div id="res-staph" style="text-align: right;">-</div>
                <div>> Listeria monocytogenes</div> <div id="res-list" style="text-align: right;">-</div>
            </div>
            
            <button onclick="resetSystem()" style="margin-top: 30px; background: transparent; border-color: rgba(255,255,255,0.5); color: white;">SELESAI / REBOOT</button>
        </div>
    </main>

    <script>
        // Jam
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000);

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ==========================================
        // FITUR RAHASIA POSITIF/NEGATIF
        // ==========================================
        let isDanger = false;
        function toggleSecret() {
            isDanger = !isDanger;
            document.getElementById('secret-dot').style.color = isDanger ? "var(--neon-red)" : "var(--bg-deep)";
        }

        // ==========================================
        // SEQUENCE 1: PERSIAPAN MEKANIK (LACI & PIPET)
        // ==========================================
        function startPreparation() {
            showScreen('screen-prep');
            document.getElementById('sys-tray').classList.remove('open');
            document.getElementById('sys-pipette').classList.remove('lowered');
            document.getElementById('sys-drop').classList.remove('falling');
            document.getElementById('sys-port').style.boxShadow = "none";
            document.getElementById('prep-status').innerText = "Sistem siap. Silakan buka laci.";
            
            let btn = document.getElementById('btn-action');
            btn.innerText = "BUKA LACI";
            btn.onclick = stepTrayOpen;
            btn.style.display = 'block';
        }

        function stepTrayOpen() {
            document.getElementById('sys-tray').classList.add('open');
            document.getElementById('prep-status').innerText = "Laci Terbuka. Kaset Terdeteksi.";
            
            let btn = document.getElementById('btn-action');
            btn.innerText = "TETESKAN SAMPEL";
            btn.onclick = stepDropSample;
        }

        function stepDropSample() {
            let btn = document.getElementById('btn-action');
            btn.style.display = 'none'; 
            document.getElementById('prep-status').innerText = "Meneteskan buffer ekstraksi...";

            document.getElementById('sys-pipette').classList.add('lowered');
            
            setTimeout(() => { document.getElementById('sys-drop').classList.add('falling'); }, 1000);

            setTimeout(() => {
                document.getElementById('sys-port').style.boxShadow = "0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue)";
                document.getElementById('sys-port').style.background = "var(--neon-blue)";
            }, 1500);

            setTimeout(() => {
                document.getElementById('sys-pipette').classList.remove('lowered');
                document.getElementById('prep-status').innerText = "Sampel diterima. Menarik laci...";
                document.getElementById('sys-tray').classList.remove('open');
            }, 2500);

            setTimeout(() => { startScanning(); }, 4000);
        }

        // ==========================================
        // SEQUENCE 2: SCANNING 
        // ==========================================
        let hexInterval;
        function startScanning() {
            showScreen('screen-scan');
            let pct = 0;
            let pctEl = document.getElementById('scan-pct');
            let logEl = document.getElementById('scan-log');
            
            hexInterval = setInterval(() => {
                let r1 = Math.random().toString(16).substr(2, 8).toUpperCase();
                let r2 = Math.random().toString(16).substr(2, 8).toUpperCase();
                document.getElementById('hex-stream-1').innerHTML = `0x${r1}<br>0x${r2}<br>` + document.getElementById('hex-stream-1').innerHTML.substring(0, 50);
                document.getElementById('hex-stream-2').innerHTML = `MEM: ${r2}<br>SEQ: ${r1}<br>` + document.getElementById('hex-stream-2').innerHTML.substring(0, 50);
            }, 100);

            let interval = setInterval(() => {
                pct += Math.floor(Math.random() * 3) + 1;
                if (pct >= 100) { pct = 100; clearInterval(interval); clearInterval(hexInterval); showResult(); }
                pctEl.innerText = pct + "%";

                if (pct < 30) logEl.innerText = "MEMBACA GARIS T1 & T2...";
                else if (pct < 60) logEl.innerText = "MENGHITUNG INTENSITAS FLUORESENSI...";
                else if (pct < 90) logEl.innerText = "KOMPARASI DATABASE PATOGEN...";
                else logEl.innerText = "MENGHASILKAN KEPUTUSAN...";
            }, 100);
        }

        // ==========================================
        // SEQUENCE 3: SHOW RESULTS
        // ==========================================
        function showResult() {
            showScreen('screen-result');
            let box = document.getElementById('result-box');
            let title = document.getElementById('res-title');
            let desc = document.getElementById('res-desc');
            
            box.classList.remove('safe', 'danger');
            
            if (!isDanger) {
                // AMAN
                box.classList.add('safe');
                title.innerText = "AMAN (NEGATIF)";
                title.style.color = "var(--neon-green)";
                desc.innerText = "Distribusi Diizinkan. Tidak ada kontaminasi berbahaya.";
                
                document.getElementById('res-ecoli').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-salmo').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-staph').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-list').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
            } else {
                // BAHAYA
                box.classList.add('danger');
                title.innerText = "BAHAYA - POSITIF";
                title.style.color = "var(--neon-red)";
                desc.innerHTML = "<b>DISTRIBUTION HOLD!</b> Segera lapor ke Dinas Kesehatan & BGN.";
                
                document.getElementById('res-ecoli').innerHTML = "<span style='color:var(--neon-red); font-weight:bold;'>10^4 CFU/mL (DETECTED!)</span>";
                document.getElementById('res-salmo').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-staph').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-list').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
            }
        }

        function resetSystem() {
            showScreen('screen-login');
        }
    </script>
</body>
</html>
