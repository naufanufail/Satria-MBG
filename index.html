<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SATRIA MBG - Ultra Pro Analyzer V4.1</title>
    <style>
        /* =========================================================
           TEMA ROYAL LAVENDER & DEEP AMETHYST (MEWAH)
           ========================================================= */
        :root {
            --bg-light: #f9f2ff; /* Putih dengan sentuhan lilac (Lilac White) */
            --bg-purple: #d4b5f0; /* Ungu lavender yang lebih matang dan mewah */
            --panel-glass: rgba(255, 255, 255, 0.85);
            --primary-violet: #4a148c; /* Ungu royal gelap (Deep Royal Purple) */
            --accent-magenta: #d500f9; /* Aksen menyala */
            --neon-green: #00e676;
            --neon-red: #ff1744;
            --text-main: #311b92;
            --ui-border: rgba(74, 20, 140, 0.25);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-purple) 100%);
            color: var(--text-main);
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* Latar Belakang Pola Titik Lembut */
        body::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--ui-border) 1px, transparent 1px);
            background-size: 25px 25px;
            z-index: -1;
        }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 2px solid rgba(142, 36, 170, 0.2);
            box-shadow: 0 4px 20px rgba(74, 20, 140, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .header-logos { display: flex; gap: 15px; align-items: center; }
        .header-logos img { width: 45px; height: 45px; object-fit: contain; }

        .sys-title { text-align: center; cursor: pointer; }
        .sys-title h1 { 
            font-size: 26px; font-weight: 900; color: var(--primary-violet); 
            letter-spacing: 3px; margin-bottom: 2px;
            text-shadow: 0 2px 5px rgba(74, 20, 140, 0.15);
        }
        .sys-title p { 
            font-size: 11px; color: #9c27b0; 
            letter-spacing: 2px; font-weight: 800;
        }
        
        #clock { font-family: 'Courier New', monospace; font-size: 18px; color: var(--primary-violet); font-weight: 800; }

        /* FOOTER */
        .sys-footer {
            position: absolute; bottom: 15px; width: 100%;
            text-align: center; font-size: 12px; font-weight: 800;
            color: rgba(74, 20, 140, 0.65); letter-spacing: 1.5px;
            text-transform: uppercase; z-index: 50;
        }

        /* =========================================================
           SISTEM MANAJEMEN LAYAR
           ========================================================= */
        .screen { 
            position: absolute; top: 85px; left: 0; right: 0; bottom: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            transform: translateZ(0);
        }
        .screen.active { 
            opacity: 1; pointer-events: auto; visibility: visible;
            animation: screenIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes screenIn { 0% { transform: scale(0.97) translateY(10px); } 100% { transform: scale(1) translateY(0); } }

        /* KOMPONEN KACA (GLASSMORPHISM) */
        .glass-box {
            background: var(--panel-glass);
            border: 1px solid rgba(255,255,255,1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(74, 20, 140, 0.15), inset 0 0 0 1px rgba(255,255,255,0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            text-align: center;
            width: 90%; max-width: 500px;
        }

        h2 { font-size: 24px; margin-bottom: 25px; font-weight: 800; color: var(--primary-violet); letter-spacing: 1px;}
        
        input {
            width: 100%; padding: 18px; margin-bottom: 20px;
            background: #fff; border: 2px solid var(--ui-border);
            color: var(--primary-violet); font-size: 16px; text-align: center;
            border-radius: 12px; outline: none; font-family: monospace; font-weight: bold;
            transition: all 0.3s; -webkit-appearance: none;
            box-shadow: inset 0 2px 5px rgba(74, 20, 140, 0.05);
        }
        input:focus { border-color: #aa00ff; box-shadow: 0 0 15px rgba(170, 0, 255, 0.2); background: #fff;}

        button {
            width: 100%; padding: 20px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #4a148c, #8e24aa);
            color: white; font-size: 16px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer; text-transform: uppercase; 
            box-shadow: 0 10px 25px rgba(74, 20, 140, 0.3);
            transition: all 0.2s; transform: translateZ(0);
        }
        button:active { transform: scale(0.96); box-shadow: 0 5px 10px rgba(74, 20, 140, 0.2); }

        /* =========================================================
           ANIMASI 3D LACI & PIPET (PREPARATION SCREEN)
           ========================================================= */
        .chamber-3d {
            perspective: 1200px; -webkit-perspective: 1200px;
            width: 100%; height: 350px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .tray {
            width: 260px; height: 340px;
            background: #f3e5f5; border: 4px solid #ab47bc; border-radius: 16px;
            transform: rotateX(65deg) translateY(-250px) translateZ(0); 
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s;
            position: relative;
            box-shadow: 0 30px 60px rgba(74, 20, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; will-change: transform;
        }
        .tray.open { transform: rotateX(60deg) translateY(0px) translateZ(0); opacity: 1; }
        
        .disc-3d {
            width: 210px; height: 210px; border-radius: 50%;
            background: repeating-conic-gradient(#fff 0 15deg, #e1bee7 15deg 30deg);
            border: 3px solid #9c27b0; position: relative;
            box-shadow: inset 0 0 25px rgba(74,20,140,0.15);
        }
        .disc-port {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; background: #fff; border-radius: 50%;
            border: 4px solid #8e24aa; transition: all 0.5s;
        }

        .pipette-container {
            position: absolute; top: -150px; left: 50%; 
            transform: translateX(-50%) translateZ(0);
            transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10;
        }
        .pipette-container.lowered { top: 60px; }
        
        .pipette {
            width: 18px; height: 140px;
            background: linear-gradient(to right, #ce93d8, #fff, #ce93d8);
            border-radius: 0 0 12px 12px; border: 2px solid #8e24aa; border-top: none;
            position: relative; margin: 0 auto;
        }
        .pipette::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 12px; background: #8e24aa; border-radius: 3px;
        }
        
        .drop {
            width: 16px; height: 16px; background: var(--accent-magenta); border-radius: 50%;
            position: absolute; bottom: -25px; left: 50%; margin-left: -8px; 
            opacity: 0; box-shadow: 0 0 20px var(--accent-magenta);
            transition: transform 0.4s ease-in, opacity 0.2s;
        }
        .drop.falling { opacity: 1; transform: translateY(160px) scale(0.5); }

        .status-text { font-family: 'Courier New', monospace; color: var(--primary-violet); font-size: 18px; font-weight: 900; margin-top: 30px; letter-spacing: 1px;}

        /* =========================================================
           ANIMASI SCANNING + LASER & KUMAN LEVITASI
           ========================================================= */
        .scanner-wrapper { position: relative; width: 320px; height: 320px; display: flex; align-items: center; justify-content: center; }
        
        .radar-spinner {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid rgba(213, 0, 249, 0.2);
            animation: spin 3s linear infinite; transform: translateZ(0);
        }
        .radar-spinner::before {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 60%, rgba(213, 0, 249, 0.4) 100%);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Laser Pemindai Naik Turun */
        .laser-beam {
            position: absolute; width: 120%; height: 3px; background: var(--accent-magenta);
            box-shadow: 0 0 15px var(--accent-magenta), 0 0 30px var(--accent-magenta);
            top: 0; left: -10%; z-index: 20; opacity: 0;
            transform: translateY(0) translateZ(0);
        }
        .scan-active .laser-beam { animation: scanLaser 1.5s ease-in-out infinite alternate; opacity: 1; }
        @keyframes scanLaser { 0% { transform: translateY(0); } 100% { transform: translateY(320px); } }

        /* Ikon Levitasi (Mengambang Organik) */
        .ikon-ompreng { font-size: 85px; position: absolute; z-index: 5; opacity: 0; transition: opacity 0.5s; }
        .ikon-float { position: absolute; font-size: 35px; opacity: 0; z-index: 10; transform: translateZ(0); }
        
        .scan-active .ikon-ompreng { opacity: 1; animation: pulseOmpreng 2s infinite alternate; }
        
        /* Animasi Mengambang di Sekitar Ompreng */
        @keyframes levitate1 { 0%, 100% { transform: translate(-90px, -60px) rotate(-10deg) scale(0.9); opacity: 1;} 50% { transform: translate(-90px, -80px) rotate(10deg) scale(1.1); opacity: 1;} }
        @keyframes levitate2 { 0%, 100% { transform: translate(90px, -50px) rotate(15deg) scale(1.1); opacity: 1;} 50% { transform: translate(90px, -30px) rotate(-5deg) scale(0.9); opacity: 1;} }
        @keyframes levitate3 { 0%, 100% { transform: translate(-70px, 80px) rotate(0deg) scale(1); opacity: 1;} 50% { transform: translate(-80px, 90px) rotate(-20deg) scale(1.2); opacity: 1;} }
        @keyframes levitate4 { 0%, 100% { transform: translate(80px, 90px) rotate(-15deg) scale(1.2); opacity: 1;} 50% { transform: translate(70px, 70px) rotate(10deg) scale(1); opacity: 1;} }

        .scan-active .k1 { animation: levitate1 3s ease-in-out infinite; }
        .scan-active .k2 { animation: levitate2 2.5s ease-in-out infinite; }
        .scan-active .m1 { animation: levitate3 3.2s ease-in-out infinite; }
        .scan-active .m2 { animation: levitate4 2.8s ease-in-out infinite; }

        @keyframes pulseOmpreng { from { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(213,0,249,0.3)); } to { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(213,0,249,0.8)); } }
        
        .core-data { 
            position: absolute; font-family: 'Courier New', monospace; font-size: 40px; 
            font-weight: 900; color: var(--primary-violet); z-index: 15; 
            text-shadow: 0 0 15px white, 0 0 25px white, 0 0 35px white; 
        }

        /* =========================================================
           HASIL (RESULT SCREEN)
           ========================================================= */
        .result-box { 
            text-align: center; padding: 40px; border-radius: 24px; 
            width: 90%; max-width: 550px; position: relative; background: white; 
            box-shadow: 0 20px 50px rgba(74,20,140,0.2);
        }
        .safe { border: 4px solid var(--neon-green); box-shadow: 0 10px 40px rgba(0, 230, 118, 0.2); }
        .danger { border: 4px solid var(--neon-red); box-shadow: 0 10px 40px rgba(255, 23, 68, 0.3); animation: pulseDanger 1s infinite alternate; }
        
        @keyframes pulseDanger { from { box-shadow: 0 0 15px rgba(255,23,68,0.15); } to { box-shadow: 0 0 45px rgba(255,23,68,0.5); } }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; text-align: left;
            background: #f3e5f5; padding: 25px; border-radius: 16px; 
            font-family: 'Courier New', monospace; font-weight: 800; font-size: 14px;
            border: 2px solid rgba(74,20,140,0.15);
        }

        #secret-dot { color: transparent; font-size: 10px; transition: color 0.3s; user-select: none; margin-left: 5px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-logos">
            <img src="logo-bgn.png" alt="BGN">
            <img src="logo-undip.png" alt="UNDIP">
        </div>
        <div class="sys-title" onclick="toggleSecret()">
            <h1>SATRIA MBG<span id="secret-dot">●</span></h1>
            <p>ADVANCED PATHOGEN ANALYZER V.4.1</p>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <!-- 1. LOGIN -->
    <main id="screen-login" class="screen active">
        <div class="glass-box">
            <h2>SYSTEM LOGIN</h2>
            <input type="text" value="OPR-SMG-77X" readonly>
            <input type="password" value="********" readonly>
            <button onclick="showScreen('screen-setup')">INISIALISASI SISTEM</button>
        </div>
    </main>

    <!-- 2. SETUP -->
    <main id="screen-setup" class="screen">
        <div class="glass-box">
            <h2>DATA BATCH MBG</h2>
            <input type="text" id="batch-id" value="BATCH_ID: MBG-2026-X99" readonly style="background:#f3e5f5;">
            <input type="text" placeholder="Komposisi Menu..." value="Nasi, Ayam Goreng, Sayur">
            <button onclick="startPreparation()">SIAPKAN KANTONG ANALISIS</button>
        </div>
    </main>

    <!-- 3. PREPARATION (3D TRAY & PIPETTE) -->
    <main id="screen-prep" class="screen">
        <h2 style="color: var(--primary-violet); font-weight: 900; margin-bottom:0;">KALIBRASI HARDWARE</h2>
        <div class="status-text" id="prep-status">Menunggu perintah sistem...</div>
        
        <div class="chamber-3d">
            <div class="pipette-container" id="sys-pipette">
                <div class="pipette"></div>
                <div class="drop" id="sys-drop"></div>
            </div>
            
            <div class="tray" id="sys-tray">
                <div class="disc-3d">
                    <div class="disc-port" id="sys-port"></div>
                </div>
            </div>
        </div>

        <button id="btn-action" onclick="stepTrayOpen()" style="width: 320px; position: absolute; bottom: 10px;">BUKA LACI KASET</button>
    </main>

    <!-- 4. SCANNING -->
    <main id="screen-scan" class="screen">
        <div class="scanner-wrapper" id="scan-anim-wrapper">
            <div class="radar-spinner"></div>
            
            <!-- Laser Effect -->
            <div class="laser-beam"></div>
            
            <!-- Levitating Icons -->
            <div class="ikon-ompreng">🍱</div>
            <div class="ikon-float k1">🦠</div>
            <div class="ikon-float k2">🦠</div>
            <div class="ikon-float m1">🍗</div>
            <div class="ikon-float m2">🥦</div>

            <div class="core-data" id="scan-pct">0%</div>
        </div>
        <div class="status-text" id="scan-log" style="margin-top: 40px; font-size: 22px;">MEMINDAI PATOGEN...</div>
    </main>

    <!-- 5. RESULT -->
    <main id="screen-result" class="screen">
        <div id="result-box" class="result-box">
            <h1 id="res-title" style="font-size: 38px; font-weight: 900; margin-bottom: 10px;">-</h1>
            <p id="res-desc" style="font-size: 16px; margin-bottom: 20px; font-weight:bold;">-</p>
            
            <div class="metrics-grid">
                <div>> E. coli O157:H7</div> <div id="res-ecoli" style="text-align: right;">-</div>
                <div>> Salmonella spp.</div> <div id="res-salmo" style="text-align: right;">-</div>
                <div>> S. aureus</div> <div id="res-staph" style="text-align: right;">-</div>
                <div>> L. monocytogenes</div> <div id="res-list" style="text-align: right;">-</div>
            </div>
            
            <button onclick="resetSystem()" style="margin-top: 35px;">SELESAI / REBOOT</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="sys-footer">
        Fakultas Kedokteran Universitas Diponegoro
    </footer>

    <script>
        // 1. Live Clock
        setInterval(() => { 
            let d = new Date();
            document.getElementById('clock').innerText = d.toLocaleTimeString('id-ID', {hour12: false}); 
        }, 1000);

        // 2. Screen Switcher
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 3. Secret Danger Toggle (Doctor Mode)
        let isDanger = false;
        function toggleSecret() {
            isDanger = !isDanger;
            document.getElementById('secret-dot').style.color = isDanger ? "#ff1744" : "transparent";
        }

        // 4. Sequence Logic
        function startPreparation() {
            showScreen('screen-prep');
            
            document.getElementById('sys-tray').classList.remove('open');
            document.getElementById('sys-pipette').classList.remove('lowered');
            document.getElementById('sys-drop').classList.remove('falling');
            document.getElementById('sys-port').style.background = "#fff";
            document.getElementById('sys-port').style.boxShadow = "none";
            
            document.getElementById('prep-status').innerText = "Sistem siap. Buka laci sekarang.";
            
            let btn = document.getElementById('btn-action');
            btn.innerText = "BUKA LACI";
            btn.onclick = stepTrayOpen;
            btn.style.display = 'block';
            btn.style.opacity = '1';
        }

        function stepTrayOpen() {
            document.getElementById('sys-tray').classList.add('open');
            document.getElementById('prep-status').innerText = "Kaset terdeteksi. Silakan teteskan.";
            
            let btn = document.getElementById('btn-action');
            btn.innerText = "TETESKAN SAMPEL";
            btn.onclick = stepDropSample;
        }

        function stepDropSample() {
            let btn = document.getElementById('btn-action');
            btn.style.opacity = '0'; 
            setTimeout(() => btn.style.display = 'none', 300);

            document.getElementById('prep-status').innerText = "Meneteskan buffer ekstraksi...";

            document.getElementById('sys-pipette').classList.add('lowered');
            
            setTimeout(() => { document.getElementById('sys-drop').classList.add('falling'); }, 800);

            setTimeout(() => {
                document.getElementById('sys-port').style.background = "var(--accent-magenta)";
                document.getElementById('sys-port').style.boxShadow = "0 0 30px var(--accent-magenta), inset 0 0 15px #fff";
            }, 1200);

            setTimeout(() => {
                document.getElementById('sys-pipette').classList.remove('lowered');
                document.getElementById('prep-status').innerText = "Sampel diserap. Memulai analisis...";
                document.getElementById('sys-tray').classList.remove('open');
            }, 2200);

            setTimeout(() => { startScanning(); }, 3500);
        }

        function startScanning() {
            showScreen('screen-scan');
            let pct = 0;
            let pctEl = document.getElementById('scan-pct');
            let logEl = document.getElementById('scan-log');
            
            document.getElementById('scan-anim-wrapper').classList.add('scan-active');

            let interval = setInterval(() => {
                pct += Math.floor(Math.random() * 4) + 1; 
                if (pct >= 100) { 
                    pct = 100; 
                    clearInterval(interval); 
                    document.getElementById('scan-anim-wrapper').classList.remove('scan-active');
                    showResult(); 
                }
                pctEl.innerText = pct + "%";

                if (pct < 30) logEl.innerText = "MEMBACA GARIS T1 & T2...";
                else if (pct < 60) logEl.innerText = "KALKULASI FLUORESENSI...";
                else if (pct < 90) logEl.innerText = "KOMPARASI DATABASE...";
                else logEl.innerText = "MENGELUARKAN HASIL...";
            }, 120);
        }

        function showResult() {
            showScreen('screen-result');
            let box = document.getElementById('result-box');
            let title = document.getElementById('res-title');
            let desc = document.getElementById('res-desc');
            
            box.classList.remove('safe', 'danger');
            
            if (!isDanger) {
                box.classList.add('safe');
                title.innerText = "AMAN (NEGATIF)";
                title.style.color = "var(--neon-green)";
                desc.innerText = "Distribusi Diizinkan. Bebas kontaminasi patogen.";
                desc.style.color = "var(--primary-violet)";
                
                document.getElementById('res-ecoli').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-salmo').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-staph').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-list').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
            } else {
                box.classList.add('danger');
                title.innerText = "BAHAYA - POSITIF";
                title.style.color = "var(--neon-red)";
                desc.innerHTML = "DISTRIBUTION HOLD! Segera lapor ke Dinas Kesehatan.";
                desc.style.color = "var(--neon-red)";
                
                document.getElementById('res-ecoli').innerHTML = "<span style='color:var(--neon-red); font-size:16px;'>10^4 CFU/mL (DETECTED)</span>";
                document.getElementById('res-salmo').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-staph').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
                document.getElementById('res-list').innerHTML = "<span style='color:var(--neon-green)'>0 CFU/mL (Clean)</span>";
            }
        }

        function resetSystem() { showScreen('screen-login'); }
    </script>
</body>
</html>
